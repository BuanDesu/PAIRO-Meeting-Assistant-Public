  <title>选择共享内容</title><link rel="stylesheet" href="capture-picker.css" />

<body>
  <header><h1>选择要分享的屏幕或窗口</h1><p>预览仅在这台电脑上显示。选择后，在电脑允许手机加入时开始向手机传送；分享整个屏幕会包含其中的通知与其他窗口。</p></header>
