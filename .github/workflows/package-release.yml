name: Package desktop and Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: choco install nsis --yes --no-progress
      - run: npm ci
      - run: npm test
      - run: npm run desktop:portable
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: release/Pairo-Meeting-Copilot-*-win-x64.exe
          if-no-files-found: error

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run android:apk
      - name: Name Android download
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/Pairo-Meeting-Copilot-${version}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: release/Pairo-Meeting-Copilot-*-android.apk
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-portable, android-apk]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: artifacts/android
      - uses: softprops/action-gh-release@v3
        with:
          name: PAIRO ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            artifacts/windows/*.exe
            artifacts/android/*.apk
