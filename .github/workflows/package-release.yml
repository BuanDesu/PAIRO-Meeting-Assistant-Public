name: Package desktop and Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: choco install nsis --yes --no-progress
      - run: npm ci
      - run: npm run release:check
      - run: npm test
      - run: npm run desktop:portable
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            release/Pairo-Meeting-Copilot-*-win-x64.exe
            release/Pairo-Meeting-Copilot-*-win-x64-folder.zip
          if-no-files-found: error

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - run: npm run release:check
      - run: npm test
      - name: Restore fixed release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PAIRO_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Configure Android release signing secrets before publishing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pairo-release.keystore"
          chmod 600 "$RUNNER_TEMP/pairo-release.keystore"
      - run: npm run android:release
        env:
          PAIRO_ANDROID_KEYSTORE: ${{ runner.temp }}/pairo-release.keystore
          PAIRO_ANDROID_STORE_PASSWORD: ${{ secrets.PAIRO_ANDROID_STORE_PASSWORD }}
          PAIRO_ANDROID_KEY_ALIAS: ${{ secrets.PAIRO_ANDROID_KEY_ALIAS }}
          PAIRO_ANDROID_KEY_PASSWORD: ${{ secrets.PAIRO_ANDROID_KEY_PASSWORD }}
      - name: Verify APK signature and version
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          version=$(node -p "require('./package.json').version")
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/release/app-release.apk | grep -F "versionName='$version'"
      - name: Name Android download
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/Pairo-Meeting-Copilot-${version}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: release/Pairo-Meeting-Copilot-*-android.apk
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-portable, android-apk]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: artifacts/android
      - run: node scripts/release-assets.mjs artifacts
      - uses: softprops/action-gh-release@v3
        with:
          name: PAIRO ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          body_path: artifacts/RELEASE_NOTES.md
          files: |
            artifacts/windows/*.exe
            artifacts/windows/*.zip
            artifacts/android/*.apk
            artifacts/SHA256SUMS.txt
